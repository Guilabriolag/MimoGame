<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo das 3 Dicas</title>
  <link rel="stylesheet" href="3dicas.css">
</head>
<body>
  <div class="container">
    <h1>Jogo das 3 Dicas</h1>
    <div id="dica-container">
      <p id="dica-text">Clique em "Começar" para receber a primeira dica!</p>
    </div>
    <div id="opcoes-container">
      <!-- Botões das opções vão aparecer aqui via JS -->
    </div>
    <button id="start-btn">Começar</button>
    <div id="resultado" class="hidden">
      <p id="resultado-text"></p>
      <button id="compartilhar-btn">Compartilhar Resultado</button>
    </div>
  </div>
  <script src="3dicas.js"></script>
</body>
</html>
